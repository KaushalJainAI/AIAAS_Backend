[pytest]
DJANGO_SETTINGS_MODULE = workflow_backend.settings.test
asyncio_mode = auto
python_files = tests.py test_*.py tests_*.py
norecursedirs = .aegis_patches .git .pytest_cache .ruff_cache scratch venv
filterwarnings =
    ignore:.*asyncio_default_fixture_loop_scope.*:pytest.PytestDeprecationWarning
